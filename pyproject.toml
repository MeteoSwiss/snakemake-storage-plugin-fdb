[project]
name = "snakemake-storage-plugin-fdb"
version = "0.3.1"
description = "Snakemake storage plugin for ECMWF's Fields DataBase (FDB)"
readme = "README.md"
requires-python = ">=3.11,<4.0"
license = "BSD-3-Clause"
license-files = ["LICENSE"]
authors = [{ name = "Francesco Zanetta" }]
dependencies = [
  "snakemake-interface-common>=1.23,<2",
  "snakemake-interface-storage-plugins>=4.4.1,<5",
  # Used directly (retry policy of the FDB I/O helpers); same bound as the interface.
  "tenacity>=9.1.4,<10",
  # ADR-018 (docs/design/architecture.md): bundled eccodes 2.47 matches currently
  # available site definitions.
  "pyfdb>=5.21.4.21,<5.22",
  "eccodes>=2.47,<2.48",
  "pyyaml>=6",
]

[dependency-groups]
dev = ["snakemake>=9.27", "pytest>=8", "ruff", "coverage"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/snakemake_storage_plugin_fdb"]

[tool.pytest.ini_options]
testpaths = ["tests"]
# Test modules may share a basename across suites (tests/ and tests/sites/*/).
addopts = ["--import-mode=importlib"]
markers = [
  "needs_samples: needs the ECMWF samples in tests/data/grib/ecmwf/",
  "site_meteoswiss: MeteoSwiss site suite (env-configured; required in CI)",
]

[tool.ruff]
line-length = 88
target-version = "py311"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP"]
