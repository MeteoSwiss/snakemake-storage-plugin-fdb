# Forecast initialisation times (ISO 8601, quoted, to the minute): one truth and one
# model run job each, one verification and one animation job per parameter. Any value
# works as an explicit target.
init_times:
  - "2020-01-01T00:00"
  - "2020-01-01T12:00"
  - "2020-01-02T00:00"
  - "2020-01-02T12:00"
  - "2020-01-03T00:00"

# Parameters under evaluation, as numeric paramIds (167, not 2t). The model writes
# exactly these (one FDB output per parameter). Adding one later makes the model rerun
# (its output is missing in FDB); removing one does not (input tracking by lookup), but
# it does rebuild scorecard.csv, whose local inputs are one file per parameter.
params:
  - 167 # 2 m temperature
  # - 165 # 10 m u wind

# Forecast steps: every query lists them all (one multi-step file per parameter).
steps: [0, 6, 12]

# The ML model checkpoints under evaluation, one experiment each. The expver of a
# checkpoint is a hash of its name: a new checkpoint is a new experiment version in FDB,
# everything else (params, steps) can change without one. The expver is a wildcard in
# every local path, so each checkpoint keeps its own metrics and animations and the
# scorecard compares them.
model:
  checkpoints:
    - "unet-v3-2026-08.ckpt"
    # - "unet-v4-2026-09.ckpt"  # add one to compare two models; the truth is shared

# The simulated truth (analyses) is archived under this expver.
truth_expver: "0002"
