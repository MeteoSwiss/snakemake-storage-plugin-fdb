# Snakemake profile for the development FDB; run from examples/forecast-evaluation/.
# Relative paths resolve against the working directory.
storage-fdb-config: ../../.fdb/config.yaml
# Try the alternatives:
# storage-fdb-input-tracking: query      # Snakemake's input-set trigger: narrowing the
#                                        # params would then rerun the model too
# storage-fdb-canonical-spelling: error  # reject param=2t, time=00, ...
# storage-fdb-archive-mode has no effect here: the
# jobs archive with plain pyfdb and the plugin's store step never runs (only api.archive
# reads it). See the user guide, "Direct access from run and script rules".
